on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      runner:
        required: true
        type: string
      target:
        required: true
        type: string
      sha:
        required: true
        type: string

permissions: {}

jobs:
  build:
    name: "${{ matrix.name }} on ${{ inputs.platform }}"
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: uv
            repository: astral-sh/uv
            packages: -p uv
            tests: uv
          - name: ruff and ty
            repository: astral-sh/ruff
            packages: -p ruff -p ty
            tests: ruff-and-ty
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PACKAGES: ${{ matrix.packages }}
      SRS_CI_TARGET: ${{ inputs.target }}
      WORKLOAD_TESTS: ${{ matrix.tests }}
    steps:
      - name: Download installed SRS snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srs-toolchain-${{ inputs.target }}-${{ inputs.sha }}
          path: ${{ runner.temp }}/srs-artifact

      - name: Link installed SRS snapshot
        run: |
          release_name="srs-ci-$SRS_CI_TARGET"
          install_root="$RUNNER_TEMP/srs-toolchains"
          mkdir -p "$install_root"
          tar -C "$install_root" \
            -xzf "$RUNNER_TEMP/srs-artifact/$release_name.tar.gz"
          rustup toolchain link srs "$install_root/$release_name"
          rustc +srs -Vv
          cargo +srs -Vv

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ matrix.repository }}
          persist-credentials: false
          path: workload

      - name: Build ${{ matrix.name }}
        working-directory: workload
        run: |
          read -ra cargo_packages <<< "$CARGO_PACKAGES"
          cargo +srs build --locked "${cargo_packages[@]}"

      - name: Test ${{ matrix.name }}
        working-directory: workload
        run: |
          case "$WORKLOAD_TESTS" in
            uv)
              cargo +srs test --locked -p uv --lib -- --test-threads=1
              for test in \
                auth::login_token_stdin \
                upgrade::upgrade_requires_production_dependency \
                upgrade::upgrade_rejects_workspace_root_non_registry_source
              do
                cargo +srs test --locked -p uv --test it "$test" -- \
                  --exact \
                  --test-threads=1
              done
              ;;
            ruff-and-ty)
              cargo +srs test --locked -p ruff --lib -- \
                --test-threads=1 \
                --skip commands::format::tests::error_diagnostics
              cargo +srs test --locked -p ty --lib -- --test-threads=1
              ;;
            *)
              printf 'unknown workload test selection: %s\n' "$WORKLOAD_TESTS" >&2
              exit 2
              ;;
          esac
